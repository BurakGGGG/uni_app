<!DOCTYPE html>
<html lang="tr">
<head>

<meta property="og:title" content="ÜniSeç — Üniversite Yaşam Rehberin">

<meta property="og:image" content="https://unisec-e36e1.web.app/icon-512.png">

<style>
  :root {
    --primary: #6C63FF; --bg: #F8F9FA; --text: #1A1B25; --text-2: #5F6270;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12131A; --text: #F2F3F7; --text-2: #A7AAB8; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;

  }
  img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 20px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  p { color: var(--text-2); margin: 10px 0 28px; font-size: 15px; line-height: 1.5; }
  a.btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 52px; padding: 0 28px; border-radius: 14px;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 15px;
    text-decoration: none;
  }
</style>

  <main>
    <img src="/icon-192.png" alt="ÜniSeç">
