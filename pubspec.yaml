name: uni_app
description: "ÜniSeç — Üniversite Yaşam Rehberi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  firebase_analytics: ^11.6.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  google_sign_in: 6.3.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI Components
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  gap: ^3.0.1
  iconsax_flutter: ^1.0.0+1

  # Utilities
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  in_app_review: ^2.0.10
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  intl: ^0.19.0
  timeago: ^3.7.1
  shared_preferences: ^2.3.4
  # Photo Viewer
  photo_view: ^0.15.0

  # Icons
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/places_seed.json
