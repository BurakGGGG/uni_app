name: uni_app
description: "ÜniSeç — Üniversite Yaşam Rehberin"
publish_to: 'none'
version: 1.0.3+14

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  firebase_analytics: ^11.6.0
  firebase_messaging: ^15.2.10
  cloud_functions: ^5.6.2
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  google_sign_in: 6.3.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI Components
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  gap: ^3.0.1
  iconsax_flutter: ^1.0.0+1

  # Utilities
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  in_app_review: ^2.0.10
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  timeago: ^3.7.1
  shared_preferences: ^2.3.4
  # Photo Viewer
  photo_view: ^0.15.0

  # Video
  video_player: ^2.9.3
  video_compress: ^3.1.3

  # Monetization
  purchases_flutter: ^10.0.2
  google_mobile_ads: ^5.3.0

  # Icons
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  flutter_native_splash: ^2.4.1
  firebase_crashlytics: ^4.3.10
  connectivity_plus: ^7.1.1
  image_cropper: ^12.2.1
  firebase_remote_config: ^5.5.0
  showcaseview: ^5.0.2
  flutter_cache_manager: ^3.4.1
  firebase_app_check: ^0.3.2+10
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/badges/
    - assets/splash/
    - assets/animations/
    - assets/logos/
    - assets/data/
    # google_fonts offline fallback — runtime font indirme crash'ini önler
    - assets/google_fonts/

flutter_native_splash:
  color: "#1A1A2E"
  image: assets/splash/unisec_mark.png
  color_dark: "#1A1A2E"
  image_dark: assets/splash/unisec_mark.png
  android_12:
    color: "#1A1A2E"
    image: assets/splash/unisec_mark_android12.png
    icon_background_color: "#1A1A2E"
    color_dark: "#1A1A2E"
    image_dark: assets/splash/unisec_mark_android12.png
    icon_background_color_dark: "#1A1A2E"
  fullscreen: true
  android: true
  ios: true
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/unisec-icon-ink-1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icons/unisec-icon-fg.png"
